name: Deploy

# Ordered deploy of a main commit that passed CI (spec 0001): it starts only when the CI workflow
# finished on a push to main with success, and it deploys that exact commit (`head_sha`), never the
# newest main. CI runs on every push to main (ci.yml), so a merge that never passed CI cannot reach
# production. Build and check the Worker first (nothing
# ships), then migrate, then the jobs, and only then ship the Worker that was already built. So
# a failing build, map upload or bundle check stops the deploy before production changes.
# Migrations must be backward compatible: old and new code run side by side during a deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The one-at-a-time rule is on the deploy job below, not on the workflow: a run that is not
# eligible (a failed or cancelled CI run) must never join the `deploy-production` group, because a
# waiting run there is replaced by the next one that arrives, even when it will only be skipped.

permissions:
  contents: read

env:
  # The commit CI tested. A manual run (workflow_dispatch) deploys the commit it was started on.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Check deploy secrets
    # A pull request, a failed or a cancelled CI run never deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: check
        # Skips the deploy (instead of failing main) until every secret and ID exists. Names only.
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          skip() {
            echo "::warning::Deploy skipped. $1"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          missing=""
          for name in DATABASE_URL_DIRECT TRIGGER_ACCESS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if grep -q "REPLACE_WITH_HYPERDRIVE_ID" wrangler.jsonc; then
            missing="$missing HYPERDRIVE_ID(wrangler.jsonc)"
          fi
          [ -z "$missing" ] || skip "Missing GitHub secrets, variables or IDs:$missing"

          # The Worker's own secrets live in Cloudflare, not GitHub. `wrangler secret list`
          # prints names only, never values. Same wrangler version as package.json.
          if ! listed=$(npx --yes wrangler@4.160.0 secret list --name take-studio --format json 2>/dev/null); then
            skip "Worker take-studio does not exist yet or its secrets can't be listed. Create it with its secrets first (wrangler secret put <NAME> --name take-studio)."
          fi
          # Every name the site needs (the web, usage and email env schemas in src/lib/env.ts; a test
          # keeps this list equal to them). A missing one stops the deploy. Optional names only warn.
          required="BETTER_AUTH_SECRET BETTER_AUTH_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET TRIGGER_SECRET_KEY USAGE_HASH_SECRET EMAIL_LINK_SECRET RESEND_API_KEY EMAIL_FROM"
          optional="SENTRY_DSN INSIGHTS_VIEWER_USER_ID"
          has() { echo "$listed" | jq -e --arg n "$1" 'any(.[]; .name == $n)' > /dev/null; }
          missing=""
          for name in $required; do
            has "$name" || missing="$missing $name"
          done
          [ -z "$missing" ] || skip "Missing Worker secrets on take-studio:$missing"
          for name in $optional; do
            has "$name" || echo "::warning::Optional Worker secret $name is not set on take-studio; the site runs without it."
          done

          # Trigger.dev Prod holds the job secrets (the job, usage and email env schemas in src/lib/env.ts,
          # plus the Deepgram key; a test keeps this list equal to them). The management API answers with
          # name and value, so the response stays in a variable and only names are ever read or printed.
          ref=$(sed -n 's/^ *project: "\(proj_[a-z0-9]*\)".*/\1/p' trigger.config.ts)
          [ -n "$ref" ] || skip "No Trigger.dev project ref in trigger.config.ts."
          if ! vars=$(curl -fsS --max-time 30 -H "Authorization: Bearer $TRIGGER_ACCESS_TOKEN" "https://api.trigger.dev/api/v1/projects/$ref/envvars/prod" 2>/dev/null); then
            skip "Trigger.dev Prod env vars can't be listed (check TRIGGER_ACCESS_TOKEN and that the prod environment exists)."
          fi
          trigger_required="R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET DATABASE_URL USAGE_HASH_SECRET BETTER_AUTH_URL RESEND_API_KEY EMAIL_FROM EMAIL_LINK_SECRET DEEPGRAM_API_KEY"
          trigger_optional="SENTRY_DSN"
          has_trigger() { echo "$vars" | jq -e --arg n "$1" 'any(.[]; .name == $n and ((.value // "") != ""))' > /dev/null; }
          missing=""
          for name in $trigger_required; do
            has_trigger "$name" || missing="$missing $name"
          done
          [ -z "$missing" ] || skip "Missing Trigger.dev Prod env vars:$missing"
          for name in $trigger_optional; do
            has_trigger "$name" || echo "::warning::Optional Trigger.dev Prod env var $name is not set; the jobs run without it."
          done

          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # Only a run that passed the gate gets here, so only an eligible run can wait in this group or
    # replace a waiting one. A running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: order
        # Serialized by the concurrency group and before any production write: an automated run
        # (workflow_run) deploys only while its commit is still the tip of main, so a rerun of CI
        # for an older commit can never put old code over newer. Otherwise it stops here with a
        # notice, without failing main (the newer commit has its own CI run and deploy). A manual
        # run (workflow_dispatch) is exempt, so an intentional rollback stays possible.
        run: |
          stale=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$tip" != "$DEPLOY_SHA" ]; then
              stale=true
              echo "::notice::Deploy skipped. $DEPLOY_SHA is no longer the tip of main (${tip:-unknown}); the tip deploys after its own CI run."
            fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.order.outputs.stale != 'true'

      - uses: actions/setup-node@v5
        if: steps.order.outputs.stale != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.order.outputs.stale != 'true'
        run: pnpm install --frozen-lockfile

      - name: 1. Build and check the Worker (nothing ships yet)
        if: steps.order.outputs.stale != 'true'
        run: pnpm run deploy:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Sentry (spec 0005): browser DSN, environment and release are inlined at build;
          # source maps upload, then `deploy:check-maps` refuses any left in public assets.
          # The Worker's own SENTRY_DSN is a Worker secret, not set here.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
          # The same DSN as the server; the GitHub secret is SENTRY_DSN.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}

      - name: 2. Migrate Neon (direct URL)
        if: steps.order.outputs.stale != 'true'
        run: pnpm db:migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Explicit opt in for the migration guard (scripts/db-guard.ts); CI=true also allows it.
          MIGRATE_TARGET: prod

      - name: 3. Deploy Trigger.dev tasks (prod)
        if: steps.order.outputs.stale != 'true'
        run: pnpm deploy:trigger --env prod
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          # Sentry (spec 0005): source maps, release and environment for the jobs. Empty
          # until the Sentry secrets exist; the deploy then simply runs without Sentry.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}

      - name: 3b. Apply the R2 lifecycle backstop (skips with a warning without R2_LIFECYCLE_TOKEN)
        if: steps.order.outputs.stale != 'true'
        run: bash scripts/apply-r2-lifecycle.sh
        env:
          R2_LIFECYCLE_TOKEN: ${{ secrets.R2_LIFECYCLE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 4. Ship the Worker (the bundle built and checked in step 1)
        if: steps.order.outputs.stale != 'true'
        run: pnpm run deploy:ship
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
