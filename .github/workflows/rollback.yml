name: Roll back the Worker

# Production runbook (docs/runbook.md, section 1). Puts an earlier Worker version live with
# `wrangler rollback`: no build, no migration, no Trigger.dev deploy, so it takes seconds and
# touches nothing but the Worker. It does NOT undo database migrations or Trigger.dev tasks.
#
# Why this and not "redeploy an older commit": the redeploy path (Deploy workflow, manual run)
# rebuilds the Worker, reruns the migration and ships new Trigger.dev tasks, which is slow and
# adds risk during an incident. A rollback only switches the Worker to a version Cloudflare
# already holds, with the bindings that version had. Migrations are backward compatible
# (expand, then contract), so the older Worker still runs on the newer schema.
#
# Guards: it only runs from main, in the `production` environment (the same approval rules as a
# deploy), and refuses to start unless the repository variable DEPLOY_FREEZE is `true` (Deploy stops itself while it is set) and no Deploy run is still going, so it never overlaps a deploy. It has its own concurrency group, so a later Deploy can never cancel a waiting rollback. Nothing here
# reads a .env file or prints a secret; version IDs are not secrets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list shows the recent Worker versions and deployments (read only). rollback switches production."
        type: choice
        options: [list, rollback]
        default: list
      version_id:
        description: "Worker version ID to roll back to (from a list run). Empty means the version before the current one."
        type: string
        required: false
      reason:
        description: "Why (required for rollback; stored with the deployment, no personal data)"
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    name: Roll back production Worker
    # Only the main branch, never a pull request branch or a tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      # Its own group, never `deploy-production`: a group keeps only one waiting run and cancels
      # the older one, so a Deploy entering a shared group could cancel a waiting rollback. Here
      # only another rollback can replace a waiting rollback (the newest one wins). The overlap
      # with a Deploy is blocked by the shared DEPLOY_FREEZE variable and the step below.
      group: rollback-production-${{ inputs.mode == 'rollback' && 'write' || github.run_id }}
      cancel-in-progress: false
    env:
      WORKER_NAME: take-studio
      # Same wrangler version as package.json and deploy.yml.
      WRANGLER: wrangler@4.160.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inputs go through the environment, never into the script text.
      MODE: ${{ inputs.mode }}
      VERSION_ID: ${{ inputs.version_id }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Check the inputs
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set for the production environment."
            exit 1
          fi
          if [ -n "$VERSION_ID" ] && ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::version_id must be a Worker version ID (a UUID) from a list run."
            exit 1
          fi
          if [ "$MODE" = "rollback" ]; then
            if [ -z "$REASON" ]; then
              echo "::error::A rollback needs a reason."
              exit 1
            fi
            if [ "${#REASON}" -gt 100 ]; then
              echo "::error::Keep the reason under 100 characters."
              exit 1
            fi
          fi

      - name: Deploys are frozen and none is going
        if: inputs.mode == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        run: |
          # Two parts, because separate workflows cannot share one concurrency queue without one
          # cancelling the other. 1) Deploy stops itself while DEPLOY_FREEZE is true, so no new
          # Deploy can reach a production write once it is set. 2) With the freeze set, one list of
          # runs that are not finished shows any Deploy that started before it. Fail loudly.
          if [ "$DEPLOY_FREEZE" != "true" ]; then
            echo "::error::Set the repository variable DEPLOY_FREEZE to true first (Settings, Secrets and variables, Actions, Variables), then run this rollback again. See docs/runbook.md, section 1."
            exit 1
          fi
          busy=$(gh run list --workflow deploy.yml --limit 50 --json databaseId,status \
            --jq '[.[] | select(.status != "completed")] | map(.databaseId) | join(" ")')
          if [ -n "$busy" ]; then
            echo "::error::A Deploy run started before the freeze is still going or waiting (run IDs: $busy). Cancel it in Actions, or wait for it to finish, then run this rollback again."
            exit 1
          fi

      - name: Show the current deployment and recent versions
        run: |
          npx --yes "$WRANGLER" deployments list --name "$WORKER_NAME"
          npx --yes "$WRANGLER" versions list --name "$WORKER_NAME"

      - name: Roll back
        if: inputs.mode == 'rollback'
        run: |
          if [ -n "$VERSION_ID" ]; then
            npx --yes "$WRANGLER" rollback "$VERSION_ID" --name "$WORKER_NAME" --message "$REASON" --yes
          else
            npx --yes "$WRANGLER" rollback --name "$WORKER_NAME" --message "$REASON" --yes
          fi

      - name: Show the deployment now live
        if: inputs.mode == 'rollback'
        run: npx --yes "$WRANGLER" deployments list --name "$WORKER_NAME"

      - name: Next steps
        if: inputs.mode == 'rollback'
        run: |
          {
            echo "### Worker rolled back"
            echo
            echo "Production runs an earlier Worker version now. This did not undo migrations or Trigger.dev tasks."
            echo "Deploys stay frozen (DEPLOY_FREEZE is true). Open a PR that reverts the bad commit on main, merge it, then set DEPLOY_FREEZE to false so the next merge deploys again. Then follow docs/runbook.md."
          } >> "$GITHUB_STEP_SUMMARY"
