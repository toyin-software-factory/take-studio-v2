name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: take_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d take_studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/take_studio
      DATABASE_URL_DIRECT: postgres://postgres:postgres@localhost:5432/take_studio
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@localhost:5432/take_studio
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: No uncommitted migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle-kit generate produced changes. Run pnpm db:generate and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Dummy env for the preview Worker
        # Not secrets: placeholders so the env schema passes. R2 is checked on the deployed Worker only.
        # Must run before the build: OpenNext bundles .env into the Worker at build time.
        run: |
          cat > .env <<ENV
          BETTER_AUTH_SECRET=ci-only-placeholder-secret-not-real-0123456789
          BETTER_AUTH_URL=http://127.0.0.1:8787
          GOOGLE_CLIENT_ID=ci
          GOOGLE_CLIENT_SECRET=ci
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          TRIGGER_SECRET_KEY=ci
          ENV

      - name: Build the Worker
        run: pnpm build:worker

      - name: No source maps in public assets
        run: pnpm run deploy:check-maps

      # No apt at run time: the e2e step runs in the official Playwright image (browsers and
      # system libraries baked in). The tag must equal @playwright/test in package.json; a unit
      # test (src/ci-config.test.ts) fails the build if they drift or if apt creeps back in.
      - name: Pull the Playwright image
        timeout-minutes: 5
        run: docker pull "$PLAYWRIGHT_IMAGE"

      - name: E2E smoke
        timeout-minutes: 10
        # Host networking keeps the Postgres service on localhost (the seed guard needs that)
        # and the preview Worker on 127.0.0.1:8787. Runs as the runner's user so no root owned
        # files are left in the workspace. The built Worker and node_modules come from the
        # steps above; the image only supplies Chromium and its libraries. The preview calls
        # pnpm, which the image lacks, so the runner's own pnpm is mounted read only (no
        # download, no apt).
        run: |
          pnpm_dir="$(dirname "$PNPM_HOME")"
          docker run --rm --network host --ipc=host --init \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI -e PNPM_HOME -e DATABASE_URL -e DATABASE_URL_DIRECT \
            -e CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE -e NEXT_TELEMETRY_DISABLED \
            -v "$GITHUB_WORKSPACE":/work -v "$pnpm_dir":"$pnpm_dir":ro -w /work \
            "$PLAYWRIGHT_IMAGE" bash -c 'export PATH="$PNPM_HOME:$PATH" && pnpm exec playwright test'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
