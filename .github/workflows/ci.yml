name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: take_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d take_studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/take_studio
      DATABASE_URL_DIRECT: postgres://postgres:postgres@localhost:5432/take_studio
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@localhost:5432/take_studio
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: No uncommitted migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle-kit generate produced changes. Run pnpm db:generate and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build the Worker
        run: pnpm build:worker

      - name: Dummy env for the preview Worker
        # Not secrets: placeholders so the env schema passes. R2 is checked on the deployed Worker only.
        run: |
          cat > .env <<ENV
          BETTER_AUTH_SECRET=ci-only-placeholder-secret-not-real-0123456789
          BETTER_AUTH_URL=http://localhost:8787
          GOOGLE_CLIENT_ID=ci
          GOOGLE_CLIENT_SECRET=ci
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          TRIGGER_SECRET_KEY=ci
          ENV

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
