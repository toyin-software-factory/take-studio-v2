name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: take_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d take_studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/take_studio
      DATABASE_URL_DIRECT: postgres://postgres:postgres@localhost:5432/take_studio
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@localhost:5432/take_studio
      NEXT_TELEMETRY_DISABLED: "1"
      # The pinned ffmpeg (the same build as trigger.config.ts).
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-09-30-13-19/ffmpeg-n7.1.2-5-g8f77695e65-linux64-gpl-7.1.tar.xz
      FFMPEG_SHA256: 49df247d3908323bf1d99c00480fed8603506cc0cb2a10ad8f905a961c3ceab8
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same pinned BtbN ffmpeg and ffprobe build the jobs use (trigger.config.ts: change the
      # URL and the hash together, a test keeps the two files equal). The ingest suites run the real
      # tools and fail, never skip, when CI is set and they are missing. Downloaded once per hash
      # (cached), checked against its SHA-256 and put on the PATH; no apt.
      - name: Cache the pinned ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-pinned
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      - name: Install the pinned ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/ffmpeg-pinned"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg-pinned" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm /tmp/ffmpeg.tar.xz

      - name: Put the pinned ffmpeg on the PATH
        run: |
          echo "$HOME/ffmpeg-pinned" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-pinned/ffmpeg" -hide_banner -version | head -1
          "$HOME/ffmpeg-pinned/ffprobe" -hide_banner -version | head -1

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Only these two suites, again, so their test counts show in the log by themselves. A skipped
      # test fails the step (with CI set the guard fails them instead, so none should be skipped).
      - name: The ffmpeg suites ran
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --no-color src/trigger/ingest-background.test.ts src/background-upload.e2e.test.ts 2>&1 | tee /tmp/ffmpeg-suites.log
          # Colour is off, and codes are stripped anyway: with CI set Vitest would otherwise dim the
          # "Tests" label and an anchored match would miss it.
          if sed 's/\x1b\[[0-9;]*m//g' /tmp/ffmpeg-suites.log | grep -E "^\s*Tests .*skipped"; then
            echo "::error::An ffmpeg suite was skipped in CI."
            exit 1
          fi

      - name: No uncommitted migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle-kit generate produced changes. Run pnpm db:generate and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Dummy env for the preview Worker
        # Not secrets: placeholders so the env schema passes. R2 is checked on the deployed Worker only.
        # Must run before the build: OpenNext bundles .env into the Worker at build time.
        run: |
          cat > .env <<ENV
          BETTER_AUTH_SECRET=ci-only-placeholder-secret-not-real-0123456789
          BETTER_AUTH_URL=http://127.0.0.1:8787
          GOOGLE_CLIENT_ID=ci
          GOOGLE_CLIENT_SECRET=ci
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET=ci
          TRIGGER_SECRET_KEY=ci
          ENV

      - name: Build the Worker
        run: pnpm build:worker

      - name: No source maps in public assets
        run: pnpm run deploy:check-maps

      # No apt at run time: the e2e step runs in the official Playwright image (browsers and
      # system libraries baked in). The tag must equal @playwright/test in package.json; a unit
      # test (src/ci-config.test.ts) fails the build if they drift or if apt creeps back in.
      - name: Pull the Playwright image
        timeout-minutes: 5
        run: docker pull "$PLAYWRIGHT_IMAGE"

      - name: E2E smoke
        timeout-minutes: 10
        # Host networking keeps the Postgres service on localhost (the seed guard needs that)
        # and the preview Worker on 127.0.0.1:8787. Runs as the runner's user so no root owned
        # files are left in the workspace. The built Worker and node_modules come from the
        # steps above; the image only supplies Chromium and its libraries. The image ships a
        # newer Node and no pnpm, so the runner's own Node (the version in .nvmrc, from
        # setup-node) and pnpm are mounted read only and put first on PATH: the tests and the
        # preview run on the same Node as everything else (no download, no apt).
        run: |
          pnpm_dir="$(dirname "$PNPM_HOME")"
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --network host --ipc=host --init \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI -e PNPM_HOME -e NODE_DIR="$node_dir" -e DATABASE_URL -e DATABASE_URL_DIRECT \
            -e CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE -e NEXT_TELEMETRY_DISABLED \
            -v "$GITHUB_WORKSPACE":/work -v "$pnpm_dir":"$pnpm_dir":ro -v "$node_dir":"$node_dir":ro -w /work \
            "$PLAYWRIGHT_IMAGE" bash -c 'export PATH="$NODE_DIR/bin:$PNPM_HOME:$PATH" && node --version && pnpm exec playwright test'

      # The production check: the same built Worker, served as production serves it (no
      # `--var DESIGN_GALLERY:1`, which the normal run adds; the build is the same, the gallery is
      # opt in at run time), and only the spec that says /design is not found. Without
      # E2E_PRODUCTION=1 that check is skipped, so this step runs it and fails on any skipped
      # test or if it did not report exactly 1 passed.
      - name: E2E production mode (the gallery is not found)
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          pnpm_dir="$(dirname "$PNPM_HOME")"
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --network host --ipc=host --init \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI -e E2E_PRODUCTION=1 -e PNPM_HOME -e NODE_DIR="$node_dir" -e DATABASE_URL -e DATABASE_URL_DIRECT \
            -e CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE -e NEXT_TELEMETRY_DISABLED \
            -v "$GITHUB_WORKSPACE":/work -v "$pnpm_dir":"$pnpm_dir":ro -v "$node_dir":"$node_dir":ro -w /work \
            "$PLAYWRIGHT_IMAGE" bash -c 'export PATH="$NODE_DIR/bin:$PNPM_HOME:$PATH" && pnpm exec playwright test tests/design.spec.ts -g "design gallery \(production\)" --reporter=list' 2>&1 | tee /tmp/e2e-production.log
          if sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e-production.log | grep -E "^\s*[0-9]+ skipped"; then
            echo "::error::The production mode check was skipped."
            exit 1
          fi
          sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e-production.log | grep -qE "^\s*1 passed" || {
            echo "::error::The production mode check did not report 1 passed."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
